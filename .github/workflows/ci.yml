name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest 已切到 26.04，ruby/setup-ruby 尚无对应 Ruby 3.3.9 的预编译包；
    # 固定到 24.04，等 setup-ruby 支持后再改回 latest。
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root@127.0.0.1:3306/weituo_test

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # 与 config/ci.rb 的步骤保持一致；拆成独立步骤，失败时能直接看出是哪一项。
      - name: Setup
        run: bin/setup --skip-server

      - name: "Style: Ruby"
        run: bin/rubocop

      - name: "Security: Gem audit"
        run: bin/bundler-audit

      - name: "Security: Importmap audit"
        run: bin/importmap audit

      - name: "Security: Brakeman"
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: "Tests: Rails"
        run: bin/rails test

      - name: "Tests: Seeds"
        run: bin/rails db:seed:replant
